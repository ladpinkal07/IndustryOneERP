version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: erp_mysql_dev
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_DATABASE: industryone_erp
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p", "rootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
